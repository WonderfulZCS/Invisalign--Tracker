<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aligner Log">
  <meta name="theme-color" content="#FAF7F2">
  <title>Invisalign Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #FAF7F2;
      color: #2B2B28;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    input, button, select, textarea {
      -webkit-user-select: text;
      user-select: text;
      font-family: inherit;
    }

    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@500;600&display=swap');

    .serif-display {
      font-family: 'Fraunces', serif;
    }

    .mono-num {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
    }

    body {
      overflow-y: auto;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px 20px env(safe-area-inset-bottom);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      gap: 16px;
    }

    .header-left h1 {
      font-size: 1.5rem;
      font-weight: 500;
      margin-top: 6px;
    }

    .header-left .label {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #9C9587;
      margin-bottom: 4px;
      display: block;
    }

    .header-right button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #EFEAE0;
      color: #6B6557;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      active: scale(0.95);
    }

    .streak {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FBEEE6;
      color: #B5563B;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .toggle-btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      font-size: 1rem;
      font-weight: 500;
      color: white;
      cursor: pointer;
      margin-bottom: 20px;
      transition: transform 0.1s;
      active: transform: scale(0.98);
    }

    .toggle-btn.wearing {
      background: #E0735C;
    }

    .toggle-btn.not-wearing {
      background: #2D6E68;
    }

    .card {
      background: white;
      border: 1px solid #EEE8DC;
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 12px rgba(43, 43, 40, 0.04);
    }

    .card.small-pad {
      padding: 20px;
    }

    .ring-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .ring {
      position: relative;
      width: 200px;
      height: 200px;
      margin-bottom: 20px;
    }

    svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .ring-hours {
      font-size: 3rem;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    .ring-goal {
      font-size: 12px;
      color: #9C9587;
      margin-top: 4px;
    }

    .add-session-btn {
      font-size: 12px;
      color: #6B6557;
      text-decoration: underline;
      text-decoration-offset: 2px;
      background: none;
      border: none;
      cursor: pointer;
      margin-top: 16px;
    }

    .sessions-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .session-item {
      background: #FAF7F2;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .session-time {
      font-size: 0.9rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .session-hours {
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: #9C9587;
    }

    .card-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #9C9587;
      margin-bottom: 12px;
      display: block;
    }

    .progress-bar {
      height: 8px;
      background: #F0EBE0;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-fill {
      height: 100%;
      background: #C9A24B;
      transition: width 0.3s ease;
    }

    .tray-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    .tray-info-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #9C9587;
    }

    .tray-info-value {
      font-family: 'JetBrains Mono', monospace;
      color: #6B6557;
    }

    .button {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .button:active {
      transform: scale(0.98);
    }

    .button-primary {
      background: #2B2B28;
      color: white;
    }

    .button-text {
      background: none;
      color: #9C9587;
      padding: 12px 0;
    }

    .button-danger {
      background: none;
      color: #E0735C;
      padding: 12px;
    }

    .heatmap {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .heatmap-cell {
      aspect-ratio: 1;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
    }

    .heatmap-cell.today {
      box-shadow: 0 0 0 2px #2B2B28, 0 0 0 4px #FAF7F2;
    }

    .heatmap-date {
      font-size: 9px;
      color: #B5AE9E;
      font-family: 'JetBrains Mono', monospace;
      text-align: center;
      margin-top: 4px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      display: none;
      z-index: 100;
    }

    .modal-backdrop.active {
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .modal {
      background: #FAF7F2;
      border-radius: 24px 24px 0 0;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      background: #E0DACC;
      border-radius: 2px;
      margin: 0 auto 24px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 1.3rem;
      font-weight: 500;
      font-family: 'Fraunces', serif;
    }

    .close-btn {
      background: none;
      border: none;
      color: #9C9587;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.9rem;
      color: #4A453C;
      margin-bottom: 6px;
    }

    input[type="time"],
    input[type="number"] {
      width: 100%;
      background: white;
      border: 1px solid #EEE8DC;
      border-radius: 12px;
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #4A453C;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .error-text {
      font-size: 12px;
      color: #E0735C;
      text-align: center;
      margin-top: 16px;
    }

    #outTimer {
      background: linear-gradient(135deg, #FFE8CC 0%, #FFDAB3 100%);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
      border: 2px solid #FFD699;
    }

    .out-timer-label {
      font-size: 12px;
      color: #C95C1A;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .out-timer-time {
      font-size: 3.5rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: #C95C1A;
      line-height: 1;
      margin-bottom: 8px;
    }

    .out-timer-warning {
      font-size: 0.9rem;
      color: #C95C1A;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <span class="label">Aligner Log</span>
        <h1 class="serif-display">Tray <span id="trayNum">1</span><span style="color: #B5AE9E; font-weight: normal;"> / <span id="trayTotal">24</span></span></h1>
      </div>
      <div class="header-right">
        <button id="settingsBtn" onclick="openSettings()">⚙️</button>
      <button id="importBtn" onclick="openImport()" style="margin-left: 8px;">📥</button>
      </div>
    </div>

    <div id="streakContainer"></div>

    <button id="toggleBtn" class="toggle-btn not-wearing" onclick="toggleWear()">Tap when you put them in</button>
    <div id="outTimer" style="display: none;"></div>

    <div class="card">
      <div class="ring-container">
        <div class="ring">
          <svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
            <circle cx="110" cy="110" r="103" stroke="#F0EBE0" stroke-width="14" fill="none" />
            <circle id="ringProgress" cx="110" cy="110" r="103" stroke="#2D6E68" stroke-width="14" fill="none"
              stroke-dasharray="646" stroke-dashoffset="646" stroke-linecap="round"
              style="transition: stroke-dashoffset 0.4s ease, stroke 0.4s ease;" />
          </svg>
          <div class="ring-text">
            <div class="ring-hours" id="hoursDisplay">0.0</div>
            <div class="ring-goal" id="goalDisplay">of 22h goal</div>
          </div>
        </div>
        <button class="add-session-btn" onclick="openSessionEditor(null)">+ add or backdate a session</button>
      </div>
    </div>

    <div id="sessionsContainer"></div>

    <div class="card small-pad">
      <span class="card-label">Current tray</span>
      <div class="tray-info">
        <span class="tray-info-label">Progress</span>
        <span class="tray-info-value"><span id="trayDay">1</span> / <span id="trayDays">14</span></span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="trayProgress" style="width: 0%"></div>
      </div>
      <div id="trayButtonContainer"></div>
    </div>

    <div class="card">
      <span class="card-label">📅 Last 14 days</span>
      <div class="heatmap" id="heatmap"></div>
    </div>

    <div id="errorContainer"></div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-backdrop">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2 class="modal-title">Plan settings</h2>
        <button class="close-btn" onclick="closeSettings()">×</button>
      </div>

      <div class="form-group">
        <label class="form-label">Daily wear goal (hours)</label>
        <div style="display: flex; align-items: center; gap: 12px;">
          <button class="button" style="width: 36px; height: 36px; padding: 0; background: #F0EBE0; color: #6B6557;"
            onclick="adjustSetting('goalHours', -1)">−</button>
          <span class="mono-num" style="width: 40px; text-align: center;" id="goalDisplay2">22</span>
          <button class="button" style="width: 36px; height: 36px; padding: 0; background: #F0EBE0; color: #6B6557;"
            onclick="adjustSetting('goalHours', 1)">+</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Days per tray</label>
        <div style="display: flex; align-items: center; gap: 12px;">
          <button class="button" style="width: 36px; height: 36px; padding: 0; background: #F0EBE0; color: #6B6557;"
            onclick="adjustSetting('trayDurationDays', -1)">−</button>
          <span class="mono-num" style="width: 40px; text-align: center;" id="trayDaysDisplay2">14</span>
          <button class="button" style="width: 36px; height: 36px; padding: 0; background: #F0EBE0; color: #6B6557;"
            onclick="adjustSetting('trayDurationDays', 1)">+</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Total trays in plan</label>
        <div style="display: flex; align-items: center; gap: 12px;">
          <button class="button" style="width: 36px; height: 36px; padding: 0; background: #F0EBE0; color: #6B6557;"
            onclick="adjustSetting('totalTrays', -1)">−</button>
          <span class="mono-num" style="width: 40px; text-align: center;" id="totalTraysDisplay2">24</span>
          <button class="button" style="width: 36px; height: 36px; padding: 0; background: #F0EBE0; color: #6B6557;"
            onclick="adjustSetting('totalTrays', 1)">+</button>
        </div>
      </div>

      <button class="button button-primary" style="margin-top: 16px;" onclick="closeSettings()">Done</button>
    </div>
  </div>

  <!-- Import/Export Modal -->
  <div id="importModal" class="modal-backdrop" onclick="closeImport()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2 class="modal-title">Import data</h2>
        <button class="close-btn" onclick="closeImport()">×</button>
      </div>

      <div class="form-group">
        <label class="form-label">Paste your data here:</label>
        <textarea id="importText" style="width: 100%; height: 150px; padding: 12px; border: 1px solid #EEE8DC; border-radius: 12px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;" placeholder='{"settings": {...}, "logs": {...}, "trays": [...]}' ></textarea>
      </div>

      <button class="button button-primary" onclick="importData()">Import</button>
      <button class="button button-text" onclick="closeImport()">Cancel</button>
    </div>
  </div>

  <!-- Session Editor Modal -->
  <div id="sessionModal" class="modal-backdrop" onclick="closeSessionEditor()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2 class="modal-title" id="sessionModalTitle">Add session</h2>
        <button class="close-btn" onclick="closeSessionEditor()">×</button>
      </div>

      <div class="form-group">
        <label class="form-label">Put in at</label>
        <input type="time" id="startTimeInput">
      </div>

      <div class="form-group">
        <label class="checkbox-group">
          <input type="checkbox" id="stillInCheckbox" onchange="updateStillIn()">
          Still wearing them
        </label>
      </div>

      <div id="endTimeGroup" class="form-group">
        <label class="form-label">Took out at</label>
        <input type="time" id="endTimeInput">
      </div>

      <button class="button button-primary" onclick="saveSession()">Save</button>
      <div id="deleteButtonContainer"></div>
      <button class="button button-text" onclick="closeSessionEditor()">Cancel</button>
    </div>
  </div>

  <script>
    const CIRCUMFERENCE = 2 * Math.PI * 103;
    const GOAL_DEFAULT = 22;
    const TRAY_DAYS_DEFAULT = 14;

    let data = {
      settings: { goalHours: GOAL_DEFAULT, trayDurationDays: TRAY_DAYS_DEFAULT, totalTrays: 24 },
      logs: {},
      trays: [{ trayNumber: 1, startDate: todayStr() }]
    };

    let editingSession = null;
    let timerInterval = null;

    function todayStr() {
      return new Date().toISOString().slice(0, 10);
    }

    function daysAgoStr(n) {
      const d = new Date();
      d.setDate(d.getDate() - n);
      return d.toISOString().slice(0, 10);
    }

    function fmtDate(s) {
      const d = new Date(s + 'T00:00:00');
      return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function hhmmOf(iso) {
      const d = new Date(iso);
      return d.toTimeString().slice(0, 5);
    }

    function fmtTime(iso) {
      const d = new Date(iso);
      return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    }

    function durationHours(startISO, endISO) {
      return (new Date(endISO) - new Date(startISO)) / 3600000;
    }

    function uid() {
      return Math.random().toString(36).slice(2, 9);
    }

    function load() {
      const saved = localStorage.getItem('aligner-data');
      if (saved) {
        try {
          data = JSON.parse(saved);
        } catch (e) {
          console.error('Failed to load data', e);
        }
      }
      // Request notification permission on first load
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
      render();
    }

    function save() {
      localStorage.setItem('aligner-data', JSON.stringify(data));
    }

    function activeSession() {
      return Object.values(data.logs).flatMap(d => d.sessions || []).find(s => s.end === null) || null;
    }

    function hoursForDate(dateKey, nowISO) {
      const sessions = data.logs[dateKey]?.sessions || [];
      const today = todayStr();
      return sessions.reduce((sum, s) => {
        let end = s.end;
        if (!end) {
          if (dateKey === today) {
            // If today and still wearing, use current time
            end = nowISO;
          } else {
            // If past day and still wearing, use end of that day (23:59:59)
            const endOfDay = new Date(dateKey + 'T23:59:59.999');
            end = endOfDay.toISOString();
          }
        }
        if (!end) return sum;
        return sum + Math.max(0, durationHours(s.start, end));
      }, 0);
    }

    function toggleWear() {
      const active = activeSession();
      const today = todayStr();

      if (active) {
        const dk = active.start.slice(0, 10);
        const sess = data.logs[dk].sessions.find(s => s.id === active.id);
        sess.end = new Date().toISOString();
      } else {
        if (!data.logs[today]) data.logs[today] = { sessions: [] };
        data.logs[today].sessions.push({ id: uid(), start: new Date().toISOString(), end: null });
      }
      save();
      render();
    }

    function openSessionEditor(session) {
      editingSession = session;
      const modal = document.getElementById('sessionModal');
      const title = document.getElementById('sessionModalTitle');
      const startInput = document.getElementById('startTimeInput');
      const endInput = document.getElementById('endTimeInput');
      const stillInCheckbox = document.getElementById('stillInCheckbox');

      if (session) {
        title.textContent = 'Edit session';
        startInput.value = hhmmOf(session.start);
        endInput.value = session.end ? hhmmOf(session.end) : '20:00';
        stillInCheckbox.checked = session.end === null;
      } else {
        title.textContent = 'Add session';
        startInput.value = '08:00';
        endInput.value = '20:00';
        stillInCheckbox.checked = false;
      }
      updateStillIn();
      modal.classList.add('active');
    }

    function updateStillIn() {
      const stillIn = document.getElementById('stillInCheckbox').checked;
      const endTimeGroup = document.getElementById('endTimeGroup');
      endTimeGroup.style.display = stillIn ? 'none' : 'block';
    }

    function closeSessionEditor() {
      document.getElementById('sessionModal').classList.remove('active');
      editingSession = null;
    }

    function saveSession() {
      const startTime = document.getElementById('startTimeInput').value;
      const endTime = document.getElementById('endTimeInput').value;
      const stillIn = document.getElementById('stillInCheckbox').checked;

      const today = todayStr();
      const [hStart, mStart] = startTime.split(':').map(Number);
      const startISO = new Date(today + 'T00:00:00');
      startISO.setHours(hStart, mStart, 0, 0);

      let endISO = null;
      if (!stillIn) {
        const [hEnd, mEnd] = endTime.split(':').map(Number);
        endISO = new Date(today + 'T00:00:00');
        endISO.setHours(hEnd, mEnd, 0, 0);
        endISO = endISO.toISOString();
      }

      const session = {
        id: editingSession ? editingSession.id : uid(),
        start: startISO.toISOString(),
        end: endISO
      };

      // Remove old version
      if (editingSession) {
        Object.keys(data.logs).forEach(dk => {
          data.logs[dk].sessions = data.logs[dk].sessions.filter(s => s.id !== session.id);
        });
      }

      const dk = today;
      if (!data.logs[dk]) data.logs[dk] = { sessions: [] };
      data.logs[dk].sessions.push(session);

      save();
      render();
      closeSessionEditor();
    }

    function deleteSession(sessionId) {
      Object.keys(data.logs).forEach(dk => {
        data.logs[dk].sessions = data.logs[dk].sessions.filter(s => s.id !== sessionId);
      });
      save();
      render();
      closeSessionEditor();
    }

    function openSettings() {
      const modal = document.getElementById('settingsModal');
      document.getElementById('goalDisplay2').textContent = data.settings.goalHours;
      document.getElementById('trayDaysDisplay2').textContent = data.settings.trayDurationDays;
      document.getElementById('totalTraysDisplay2').textContent = data.settings.totalTrays;
      modal.classList.add('active');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('active');
    }

    function adjustSetting(key, delta) {
      const setting = document.getElementById(key === 'goalHours' ? 'goalDisplay2' : key === 'trayDurationDays' ? 'trayDaysDisplay2' : 'totalTraysDisplay2');
      let val = parseInt(setting.textContent) + delta;
      if (key === 'goalHours') val = Math.max(1, Math.min(24, val));
      if (key === 'trayDurationDays') val = Math.max(1, Math.min(30, val));
      if (key === 'totalTrays') val = Math.max(1, Math.min(99, val));
      setting.textContent = val;
      data.settings[key] = val;
      save();
      render();
    }

    function startNextTray() {
      const currentTray = data.trays[data.trays.length - 1];
      data.trays.push({ trayNumber: currentTray.trayNumber + 1, startDate: todayStr() });
      save();
      render();
    }

    function render() {
      const today = todayStr();
      const active = activeSession();
      const currentTray = data.trays[data.trays.length - 1];
      const settings = data.settings;
      const now = new Date().toISOString();

      // Tray info
      document.getElementById('trayNum').textContent = currentTray.trayNumber;
      document.getElementById('trayTotal').textContent = settings.totalTrays;

      const trayStart = new Date(currentTray.startDate + 'T00:00:00');
      const dayOfTray = Math.floor((new Date(today + 'T00:00:00') - trayStart) / 86400000) + 1;
      const trayDue = dayOfTray >= settings.trayDurationDays;

      document.getElementById('trayDay').textContent = Math.max(1, dayOfTray);
      document.getElementById('trayDays').textContent = settings.trayDurationDays;

      const trayPct = Math.min(100, (Math.max(1, dayOfTray) / settings.trayDurationDays) * 100);
      document.getElementById('trayProgress').style.width = trayPct + '%';

      // Tray button
      const trayButtonContainer = document.getElementById('trayButtonContainer');
      if (trayDue) {
        trayButtonContainer.innerHTML = `<button class="button button-primary" onclick="startNextTray()">Start tray ${currentTray.trayNumber + 1} →</button>`;
      } else {
        const daysLeft = settings.trayDurationDays - Math.max(1, dayOfTray);
        trayButtonContainer.innerHTML = `<p style="font-size: 0.9rem; color: #8A8478;">${daysLeft} day${daysLeft === 1 ? '' : 's'} left on this tray.</p>`;
      }

      // Hours for today
      const hoursToday = hoursForDate(today, now);
      const goal = settings.goalHours;
      const pct = Math.min(100, Math.round((hoursToday / goal) * 100));
      const offset = CIRCUMFERENCE - (pct / 100) * CIRCUMFERENCE;

      document.getElementById('ringProgress').setAttribute('stroke-dashoffset', offset);
      document.getElementById('ringProgress').setAttribute('stroke', pct >= 70 ? '#2D6E68' : '#E0735C');
      document.getElementById('hoursDisplay').textContent = hoursToday.toFixed(1);
      document.getElementById('goalDisplay').textContent = `of ${goal}h goal`;

      // Toggle button and out timer
      const toggleBtn = document.getElementById('toggleBtn');
      const outTimerDiv = document.getElementById('outTimer');
      
      if (active) {
        const elapsed = durationHours(active.start, now);
        toggleBtn.textContent = `Wearing — ${elapsed.toFixed(1)}h · tap to take out`;
        toggleBtn.classList.add('wearing');
        toggleBtn.classList.remove('not-wearing');
        outTimerDiv.style.display = 'none';
      } else {
        toggleBtn.textContent = 'Tap when you put them in';
        toggleBtn.classList.add('not-wearing');
        toggleBtn.classList.remove('wearing');
        
        // Find last session end time
        let lastEndTime = null;
        Object.keys(data.logs).forEach(dk => {
          (data.logs[dk].sessions || []).forEach(s => {
            if (s.end && (!lastEndTime || new Date(s.end) > new Date(lastEndTime))) {
              lastEndTime = s.end;
            }
          });
        });
        
        if (lastEndTime) {
          const outDuration = durationHours(lastEndTime, now);
          const hours = Math.floor(outDuration);
          const mins = Math.floor((outDuration - hours) * 60);
          const secs = Math.floor((outDuration * 3600) % 60);
          
          const timeStr = `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
          outTimerDiv.innerHTML = `
            <div class="out-timer-label">⏱️ Out since</div>
            <div class="out-timer-time">${timeStr}</div>
            <div class="out-timer-warning">Put them back in soon!</div>
          `;
          outTimerDiv.style.display = 'block';
        } else {
          outTimerDiv.style.display = 'none';
        }
      }

      // Tray due notification
      const lastNotifTime = localStorage.getItem('last-tray-notif-time');
      if (trayDue && (!lastNotifTime || new Date().getTime() - parseInt(lastNotifTime) > 3600000)) {
        // Show browser notification if permitted (max once per hour)
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification('Time to change your aligner', {
            body: `Tray ${currentTray.trayNumber} is ready to be changed to Tray ${currentTray.trayNumber + 1}`,
            icon: '😁'
          });
        }
        localStorage.setItem('last-tray-notif-time', new Date().getTime().toString());
      }

      // Streak
      let streak = 0;
      for (let i = 0; i < 365; i++) {
        const d = daysAgoStr(i);
        const h = hoursForDate(d, now);
        const hasLog = (data.logs[d]?.sessions || []).length > 0;
        if (d === today && !hasLog) continue;
        if (hasLog && h >= goal) {
          streak++;
        } else if (d === today) {
          continue;
        } else {
          break;
        }
      }

      const streakContainer = document.getElementById('streakContainer');
      let streakHtml = '';
      if (streak > 0) {
        streakHtml = `<div class="streak">🔥 ${streak} day${streak === 1 ? '' : 's'} on goal</div>`;
      }
      if (trayDue) {
        streakHtml += `<div style="background: #FFE8CC; color: #C95C1A; padding: 12px; border-radius: 12px; margin-bottom: 16px; font-weight: 500; text-align: center;">⏰ Time to change to Tray ${currentTray.trayNumber + 1}</div>`;
      }
      streakContainer.innerHTML = streakHtml;

      // Today's sessions
      const todaySessions = (data.logs[today]?.sessions || []).slice().sort((a, b) => new Date(a.start) - new Date(b.start));
      const sessionsContainer = document.getElementById('sessionsContainer');
      if (todaySessions.length > 0) {
        let html = '<div class="card small-pad"><span class="card-label">Today\'s sessions</span><div class="sessions-list">';
        todaySessions.forEach(s => {
          const duration = (s.end ? durationHours(s.start, s.end) : durationHours(s.start, now)).toFixed(1);
          html += `<div class="session-item" onclick="openSessionEditor(${JSON.stringify(s).replace(/"/g, '&quot;')})">
            <span class="session-time">${fmtTime(s.start)} – ${s.end ? fmtTime(s.end) : 'now'}</span>
            <span class="session-hours">${duration}h ✏️</span>
          </div>`;
        });
        html += '</div></div>';
        sessionsContainer.innerHTML = html;
      } else {
        sessionsContainer.innerHTML = '';
      }

      // Heatmap
      const last14 = Array.from({ length: 14 }, (_, i) => daysAgoStr(13 - i));
      let heatmapHtml = '';
      last14.forEach(d => {
        const hasLog = (data.logs[d]?.sessions || []).length > 0;
        const h = hoursForDate(d, now);
        let bg = '#F0EBE0';
        if (hasLog) {
          bg = h >= goal ? '#2D6E68' : h >= goal * 0.6 ? '#E0B85C' : '#E0735C';
        }
        const title = `${fmtDate(d)}: ${hasLog ? h.toFixed(1) + 'h' : 'no log'}`;
        const isToday = d === today ? ' today' : '';
        heatmapHtml += `<div><div class="heatmap-cell${isToday}" style="background: ${bg};" title="${title}"></div><div class="heatmap-date">${d.slice(8, 10)}</div></div>`;
      });
      document.getElementById('heatmap').innerHTML = heatmapHtml;

      // Error if any
      const errorContainer = document.getElementById('errorContainer');
      errorContainer.innerHTML = '';
    }

    // Refresh every second for live timer updates
    setInterval(() => {
      render();
    }, 1000);

    function openImport() {
      const modal = document.getElementById('importModal');
      document.getElementById('importText').value = '';
      modal.classList.add('active');
    }

    function closeImport() {
      document.getElementById('importModal').classList.remove('active');
    }

    function importData() {
      const text = document.getElementById('importText').value.trim();
      if (!text) {
        alert('Please paste your data');
        return;
      }
      try {
        const imported = JSON.parse(text);
        if (imported.settings && imported.logs !== undefined && imported.trays) {
          // Merge imported data with existing
          data = imported;
          save();
          render();
          closeImport();
          alert('Data imported successfully!');
        } else {
          alert('Invalid data format');
        }
      } catch (e) {
        alert('Error: ' + e.message);
      }
    }

    function exportData() {
      const json = JSON.stringify(data);
      alert('Copy this:\n\n' + json);
    }

    // Initial load
    load();
  </script>
</body>
</html>
